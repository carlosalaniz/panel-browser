services:
  browser:
    build:
      context: ../app
    environment:
      DATA_DIR: /data
      STREAM_PORT: "8080"
      SETTINGS_PORT: "8081"
    volumes:
      - type: volume
        source: data
        target: /data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  data: {}
